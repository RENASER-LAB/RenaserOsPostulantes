<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <!-- El mismo valor que `--cielo`: es el color con el que el telefono pinta su
       propia barra, y desincronizarlo deja una franja de otro tono arriba. -->
  <meta name="theme-color" content="#fbf1e9">
  <link rel="icon" type="image/svg+xml" href="/hormiga.svg">
  <meta name="description" content="EX · Oportunidades profesionales en Renaser Consulting.">
  <!--
    Figtree la sirve el propio sitio, no Google Fonts: una aplicacion instalada
    no puede quedarse sin sus titulares porque el telefono no tenga cobertura.
    Los `@font-face` viven en `mundo.css` y los archivos en `public/tipografia/`.

    Se precarga el subconjunto latino —el unico que el español necesita casi
    siempre— porque lo descubre el navegador dentro del CSS, es decir tarde.
  -->
  <link rel="preload" href="/tipografia/figtree-latin.woff2" as="font" type="font/woff2" crossorigin>
  <title>EX · Empleos en Renaser</title>
</head>
<body>
  <!--
    THESIS: Un portal de producto moderno donde la accion es negra y el color
    aparece una sola vez. Refuta el hero con foto de oficina y el azul corporativo.
    OWN-WORLD: Fondo pastel calido #FBF1E9 con las superficies en nube blanca
    encima, tinta #333 y accion en negro pleno #0A0A0A con radio corto. El coral
    #FF7C61 marca «te toca a ti» dentro de las pantallas, y en la cabecera tambien
    el destino actual y el boton de entrar. Figtree servida por el sitio, 600 en
    titulares.
    STORY: Sabe en tres segundos si le toca algo, ve el recorrido entero desde la
    portada, y empieza la accion sin buscarla.
    FIRST VIEWPORT: Titular centrado con la pieza coral incrustada, dos acciones,
    y el escaparate —tarjeta blanca de borde grueso— con el recorrido de cinco
    tramos dentro y el resplandor detras.
    FORM: direccion fijada por el usuario a partir de originx.demos.tailgrids.com;
    reemplaza a «El canto» (semilla c0c8e906) el 10/09/2026.
    FINISH: unreviewed and undocumented is unfinished; this build ends with the
    finish review, the verdict, DESIGN.md, and every shipping raster carrying
    its provenance
  -->
  <div id="raiz"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
